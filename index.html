<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Варта & Світло</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--tx:#0f1720;--mut:#5b6776;--bd:#dde2e9;--ok:#1a9e55;--al:#e0312d;--wn:#d99a00;--ac:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f14;--card:#121821;--tx:#e6edf3;--mut:#8b98a8;--bd:#222c3a;--ok:#2ecc71;--al:#ff4d4a;--wn:#f5b301;--ac:#4c8dff}}
:root[data-theme="dark"]{--bg:#0b0f14;--card:#121821;--tx:#e6edf3;--mut:#8b98a8;--bd:#222c3a;--ok:#2ecc71;--al:#ff4d4a;--wn:#f5b301;--ac:#4c8dff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:16px;margin:0;letter-spacing:.08em}
.live{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;color:var(--mut);font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block}
.live .dot{animation:p 1.6s infinite}
@keyframes p{50%{opacity:.25}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 8px;border:1px solid var(--bd);border-radius:99px;color:var(--mut);display:flex;gap:5px;align-items:center}
.chip.off .dot{background:var(--al)}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--ac)}
main{display:grid;gap:12px;padding:12px 16px;max-width:1100px;margin:0 auto;grid-template-columns:1fr 1fr;grid-template-areas:"my map" "act map" "feed stat" "src src"}
@media(max-width:760px){main{grid-template-columns:1fr;grid-template-areas:"my" "map" "act" "feed" "stat" "src"}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;min-width:0}
.card h2{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
#my{grid-area:my;border-left:5px solid var(--ok)}#my.alert{border-left-color:var(--al)}#my.warn{border-left-color:var(--wn)}
#my .big{font-size:22px;font-weight:700}
#my .st{font-size:18px;margin:4px 0}
.m{color:var(--mut);font-size:13px}
#map{grid-area:map}#act{grid-area:act}#feed{grid-area:feed}#stat{grid-area:stat}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.t{aspect-ratio:1.15;border-radius:6px;border:1px solid var(--bd);background:var(--bd);color:var(--tx);font-size:clamp(8px,1.6vw,11px);padding:2px;text-align:center;display:flex;align-items:center;justify-content:center;line-height:1.05;overflow:hidden;word-break:break-word}
.t.e{visibility:hidden}
.t.calm{background:color-mix(in srgb,var(--ok) 25%,var(--card))}
.t.warn{background:var(--wn);color:#111}
.t.alert{background:var(--al);color:#fff;animation:p 1.2s infinite}
.t.me{outline:2px solid var(--ac);outline-offset:1px}
.lg{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--mut)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
#det{margin-top:10px;padding-top:10px;border-top:1px solid var(--bd);font-size:14px}
.row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.row:last-child{border:0}
.feedrow{font-size:13px;padding:5px 0;border-bottom:1px solid var(--bd);display:flex;gap:8px}
.feedrow b{font-variant-numeric:tabular-nums;color:var(--mut);font-weight:500}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kpi div{font-size:26px;font-weight:700}.kpi span{display:block;font-size:11px;color:var(--mut);font-weight:400
