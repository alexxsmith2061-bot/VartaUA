<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ВАРТА & ТРЕШ</title>
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #151c2c;
            --bg-card: #1e293b;
            --accent-red: #ef4444;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* HEADER */
        .header {
            background-color: var(--bg-secondary);
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .logo-title {
            font-weight: 800;
            font-size: 1.05rem;
            color: var(--text-main);
        }

        .logo-sub {
            font-size: 0.65rem;
            color: var(--accent-blue);
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-badge {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid var(--accent-red);
            color: #fca5a5;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        /* MAIN CONTENT CONTAINER */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 75px;
        }

        .tab-pane {
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .tab-pane.active {
            display: flex;
        }

        /* CARDS */
        .card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid var(--border);
        }

        .card-header {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-sub);
            margin-bottom: 10px;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* BANNER LOZOVA */
        .lozova-banner {
            background: linear-gradient(135deg, #1e1b4b, #311b92);
            border: 1px solid rgba(99, 102, 241, 0.4);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .lozova-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: #c7d2fe;
        }

        .lozova-sub {
            font-size: 0.75rem;
            color: #a5b4fc;
            margin-top: 2px;
        }

        /* MAP SVG */
        .map-box {
            background: #0f172a;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }

        .map-svg {
            width: 100%;
            max-height: 210px;
        }

        .region-shape {
            fill: #1e293b;
            stroke: #334155;
            stroke-width: 1.5;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .region-shape:hover {
            opacity: 0.8;
        }

        .region-shape.danger {
            fill: #7f1d1d;
            stroke: #ef4444;
        }

        .region-shape.lozova {
            stroke: #818cf8;
            stroke-width: 2.5;
        }

        .map-text {
            fill: #94a3b8;
            font-size: 10px;
            font-weight: 700;
            pointer-events: none;
        }

        /* RADAR */
        .radar-item {
            background: var(--bg-card);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            border-left: 3px solid var(--accent-red);
        }

        .radar-title {
            font-size: 0.85rem;
            font-weight: 700;
        }

        .radar-route {
            font-size: 0.72rem;
            color: var(--text-sub);
        }

            border: none;
