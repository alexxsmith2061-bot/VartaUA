<script>
        let globalDb = {};
        let airAlerts = {};
        let outageStatuses = {};
        let selectedAirCity = "";
        let selectedOutCity = "";

        function switchTab(tabName, el) {
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if (tabName === 'air') {
                document.getElementById('pane-air').classList.add('active');
            } else {
                document.getElementById('pane-outages').classList.add('active');
                if(!document.getElementById('out-region-select').hasChildNodes()) initOutageSelectors();
            }
            el.classList.add('active');
        }

        function initAirSelectors() {
            const regSel = document.getElementById('air-region-select');
            regSel.innerHTML = '';
            for (const reg in globalDb) {
                const opt = document.createElement('option');
                opt.value = reg; opt.innerText = reg;
                regSel.appendChild(opt);
            }
            onAirRegionChange();
        }

        function onAirRegionChange() {
            document.getElementById('air-city-input').value = '';
            selectedAirCity = '';
            renderAirStatus();
        }

        function filterAirCities() {
            const reg = document.getElementById('air-region-select').value;
            const query = document.getElementById('air-city-input').value.toLowerCase().trim();
            const listEl = document.getElementById('air-autocomplete');
            listEl.innerHTML = '';

            if (!query || !globalDb[reg]) {
                listEl.style.display = 'none';
                return;
            }

            const matches = globalDb[reg].filter(c => c.toLowerCase().includes(query));
            if (matches.length === 0) {
                listEl.style.display = 'none';
                return;
            }

            matches.forEach(city => {
                const item = document.createElement('div');
                item.className = 'autocomplete-item';
                // Показуємо у випадаючому списку назву та область, як у Новій Пошті
                item.innerHTML = `${city} <span style="font-size:0.7rem; color:var(--text-sub); float:right;">(${reg})</span>`;
                item.onclick = () => {
                    document.getElementById('air-city-input').value = city;
                    selectedAirCity = city;
                    listEl.style.display = 'none';
                    renderAirStatus();
                };
                listEl.appendChild(item);
            });
            listEl.style.display = 'block';
        }

        function renderAirStatus() {
            const reg = document.getElementById('air-region-select').value;
            const card = document.getElementById('air-result-card');
            const title = document.getElementById('air-res-title');
            const badge = document.getElementById('air-res-badge');
            const desc = document.getElementById('air-res-desc');

            title.innerText = selectedAirCity ? `${selectedAirCity} (${reg})` : (reg || 'Локація');
            const alertData = airAlerts[reg] || { code: 'green', text: 'ТИША', detail: 'Штатний режим.' };

            if (alertData.code === 'red') {
                card.className = 'result-card red';
                badge.className = 'res-badge code-red-tag';
                badge.innerText = alertData.text;
            } else {
                card.className = 'result-card';
                badge.className = 'res-badge code-green-tag';
                badge.innerText = alertData.text;
            }
            desc.innerHTML = `📍 Обрана локація: <b>${selectedAirCity || 'Вся область'}</b><br>📡 Статус простору: ${alertData.detail}`;
        }

        function initOutageSelectors() {
            const regSel = document.getElementById('out-region-select');
            regSel.innerHTML = '';
            for (const reg in globalDb) {
                const opt = document.createElement('option');
                opt.value = reg; opt.innerText = reg;
                regSel.appendChild(opt);
            }
            onOutRegionChange();
        }

        function onOutRegionChange() {
            document.getElementById('out-city-input').value = '';
            selectedOutCity = '';
            renderOutageStatus();
        }

        function filterOutCities() {
            const reg = document.getElementById('out-region-select').value;
            const query = document.getElementById('out-city-input').value.toLowerCase().trim();
            const listEl = document.getElementById('out-autocomplete');
            listEl.innerHTML = '';

            if (!query || !globalDb[reg]) {
                listEl.style.display = 'none';
                return;
            }

            const matches = globalDb[reg].filter(c => c.toLowerCase().includes(query));
            if (matches.length === 0) {
                listEl.style.display = 'none';
                return;
            }

            matches.forEach(city => {
                const item = document.createElement('div');
                item.className = 'autocomplete-item';
                // Показуємо у випадаючому списку назву та область
                item.innerHTML = `${city} <span style="font-size:0.7rem; color:var(--text-sub); float:right;">(${reg})</span>`;
                item.onclick = () => {
                    document.getElementById('out-city-input').value = city;
                    selectedOutCity = city;
                    listEl.style.display = 'none';
                    renderOutageStatus();
                };
                listEl.appendChild(item);
            });
            listEl.style.display = 'block';
        }

        function renderOutageStatus() {
            const reg = document.getElementById('out-region-select').value;
            const title = document.getElementById('out-res-title');
            const desc = document.getElementById('out-res-desc');
            const targetCity = selectedOutCity ? `${selectedOutCity} (${reg})` : (reg || 'Локація не обрана');

            title.innerText = targetCity;
            const outageText = outageStatuses[reg] || "⚡ Штатний режим живлення";

            desc.innerHTML = `🏠 Обрана адреса: <b>${selectedOutCity || 'Вся область'}</b><br>📅 Дата звіту: <b>09.10.2026</b><br>⚡ Офіційний стан: <b>${outageText}</b>`;
        }

        async function fetchLiveAlerts() {
            try {
                const res = await fetch('https://vartaua.onrender.com/api/live-status');
                const data = await res.json();
                globalDb = data.regions_db;
                airAlerts = data.air_alerts;
                outageStatuses = data.outages_status;

                if (!document.getElementById('air-region-select').hasChildNodes()) {
                    initAirSelectors();
                } else {
                    renderAirStatus();
                }
                if (document.getElementById('pane-outages').classList.contains('active')) {
                    renderOutageStatus();
                }

                const now = new Date();
                document.getElementById('update-time').innerText = `Оновлено: ${now.toLocaleTimeString()}`;
            } catch (e) {
                console.log("Очікування зв'язку з бекендом...");
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchLiveAlerts();
            setInterval(fetchLiveAlerts, 4000);
        });
    </script>
